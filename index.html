<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bell Studio</title>
  <meta name="description" content="Plan and track Bell Studio's departments, channels, products and clips.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // GitHub Pages lets browsers keep files for ~10 minutes. A stamp that changes every minute makes a fresh deploy show up without a hard refresh.
    window.BELL_V = Math.floor(Date.now() / 60000);
    document.write('<link rel="stylesheet" href="style.css?v=' + window.BELL_V + '">');
  </script>
</head>
<body>
  <div class="nav-wrap" id="nav"></div>
  <main id="main" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>
  <aside class="inspector" id="inspector" aria-label="Inspector" hidden></aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    ["data.js", "news.js", "i18n.js", "store.js", "app.js"].forEach(function (src) {
      var el = document.createElement("script");
      el.src = src + "?v=" + window.BELL_V;
      el.async = false; // keep this order
      document.body.appendChild(el);
    });
  </script>
  <noscript>This page needs JavaScript.</noscript>
</body>
</html>
